# Don't run native postinstall build scripts — prebuilt/tooling deps the
# production build doesn't need to compile (matches prior working build).
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false

# Supply-chain hardening: refuse dependency versions published within the last
# 1440 minutes (24h) so pnpm never locks a just-published package. This mirrors
# Vercel's minimumReleaseAge deploy policy — the lockfile pnpm resolves is then
# always accepted by the deploy's supply-chain check, instead of failing with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION on a fresh transitive bump (as a
# Dependabot `next` bump did by pulling a same-day postcss / baseline-browser-
# mapping). Keep this >= the Vercel project's release-age window.
minimumReleaseAge: 1440

# Force a patched PostCSS everywhere — clears GHSA-qx2v-qp2m-jg93 (XSS via
# unescaped </style> in CSS stringify). Next.js bundles a vulnerable 8.4.31.
#
# Force a patched Vite (dev/test only, via vitest + @vitejs/plugin-react) —
# clears GHSA-fx2h-pf6j-xcff (server.fs.deny bypass) and GHSA-v6wh-96g9-6wx3
# (launch-editor NTLM hash disclosure; 8.1.x drops the launch-editor dep).
overrides:
  postcss: '>=8.5.10'
  vite: '>=8.1.2'
