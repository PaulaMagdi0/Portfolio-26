name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each gate is its own step so a failure annotation points at the exact stage.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm type-check

      - name: Unit & a11y tests
        run: pnpm test:ci

      - name: Build
        run: pnpm exec next build
        env:
          # Match production canonical/OG/hreflang URLs at build time.
          NEXT_PUBLIC_SITE_URL: https://paulamagdy.com

  e2e:
    name: E2E · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright builds and serves the production app itself (see playwright.config.ts),
      # so this exercises prerendered routes, the drawer, the contact form (route-mocked),
      # theme/locale persistence, and the runtime axe scan on both locales.
      - name: Playwright (Chromium)
        run: pnpm exec playwright test --project=chromium
        env:
          NEXT_PUBLIC_SITE_URL: https://paulamagdy.com

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
